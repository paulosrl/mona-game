# A página pública do jogo (GitHub Pages), para jogar no navegador ou no celular sem o Copilot
# App. A cada envio à main, publica o game.html da extensão como a raiz do site. As ações vão
# fixadas pelo commit (o Dependabot as atualiza), como no verificacao.yml.
name: pages

on:
  push:
    branches: [main]
    paths:
      - .github/extensions/monas-octoverse-arcade-starter/game.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: O jogo como a raiz do site
        run: |
          mkdir -p _site
          cp .github/extensions/monas-octoverse-arcade-starter/game.html _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
